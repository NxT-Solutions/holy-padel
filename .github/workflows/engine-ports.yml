name: Engine ports

# The Swift (watchOS) and Kotlin (Wear OS) ports of the scoring engine must
# reproduce the canonical TS engine's 972 golden vectors exactly. This runs both
# suites on every change to a port or to the vectors themselves.
on:
  push:
    branches: [main]
    paths:
      - "packages/scoring-swift/**"
      - "packages/scoring-kotlin/**"
      - "packages/scoring/vectors/**"
      - ".github/workflows/engine-ports.yml"
  pull_request:
    paths:
      - "packages/scoring-swift/**"
      - "packages/scoring-kotlin/**"
      - "packages/scoring/vectors/**"
      - ".github/workflows/engine-ports.yml"
  workflow_dispatch:

concurrency:
  group: engine-ports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-vectors:
    name: swift-vectors
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/scoring-swift
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)"
      - name: swift test (972 golden vectors)
        run: swift test

  kotlin-vectors:
    name: kotlin-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/scoring-kotlin
    steps:
      - uses: actions/checkout@v7
      # Gradle 8.11.1 supports JDK <= 23; a newer default JDK breaks it.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - name: gradlew test (972 golden vectors)
        run: ./gradlew test --no-daemon --stacktrace
