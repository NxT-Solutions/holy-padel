name: Native E2E

# Maestro drives the real native app on an Android emulator — the shell
# behaviour the Playwright web suite can't reach (OS alerts, cold-start
# persistence, native navigation). The Android build is ~20 minutes, so this
# runs on merges to main, on demand, and on PRs only when labelled `native-e2e`.
# It is intentionally NOT a required status check until proven green in CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  maestro-android:
    name: maestro-android
    if: github.event_name != 'pull_request' || github.event.label.name == 'native-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build a release APK (JS bundled, debug-signed — no secrets needed)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            mkdir -p screenshots
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml

      - name: Upload the Maestro report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          # takeScreenshot writes to ./screenshots (repo root); the report dir
          # only holds Maestro's own failure captures.
          path: |
            maestro-report.xml
            screenshots/
            ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: ignore
