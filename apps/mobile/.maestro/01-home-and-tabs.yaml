# Native tab bar navigation and the seeded home card.
appId: com.holypadel.app
name: Home and native tab navigation
---
- runFlow: subflows/launch-seeded.yaml

# The seeded live match reads exactly as the design's home screen.
- assertVisible: "CLUB PADEL NORTE"
- assertVisible: "WATCH PAIRED"
- assertVisible: "RESUME SCORING"
- assertVisible:
    id: "home-score-line"
    text: "6-4 · 4-3"

# The floating pill tab bar switches tabs natively. waitForAnimationToEnd lets
# the tab transition settle so the assertion reads the committed hierarchy.
- tapOn:
    id: "tab-matches"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "13 stored locally"
    timeout: 15000
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "WIN RATE"
    timeout: 15000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 15000
