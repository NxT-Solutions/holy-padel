# Tap-to-score, the status pill and native undo on the live scoreboard.
appId: com.holypadel.app
name: Live scoring, status pill and undo
---
- runFlow: subflows/launch-seeded.yaml

- tapOn: "RESUME SCORING"
- extendedWaitUntil:
    visible:
      id: "point-A"
      text: "40"
    timeout: 20000
- assertVisible: "GAME POINT — NICO & JAVI"

# Level the game to deuce, then advantage, exercising the point calls.
- tapOn: "Point Marta & Leo"
- extendedWaitUntil:
    visible: "DEUCE"
    timeout: 10000
- tapOn: "Point Nico & Javi"
- extendedWaitUntil:
    visible: "ADVANTAGE — NICO & JAVI"
    timeout: 10000

# Native undo steps the score back one point.
- tapOn: "UNDO"
- extendedWaitUntil:
    visible: "DEUCE"
    timeout: 10000
