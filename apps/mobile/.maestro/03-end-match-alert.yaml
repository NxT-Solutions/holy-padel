# The in-app "End match?" sheet protects against losing an unfinished score.
appId: com.holypadel.app
name: End match sheet
---
- runFlow: subflows/launch-seeded.yaml

- tapOn: "RESUME SCORING"
- extendedWaitUntil:
    visible:
      id: "point-A"
      text: "40"
    timeout: 20000

# Cancel first: the end sheet appears, "Keep playing" dismisses it, score intact.
- tapOn: "END MATCH"
- extendedWaitUntil:
    visible: "END THE MATCH?"
    timeout: 10000
- tapOn:
    id: "end-keep-playing"
- assertVisible:
    id: "point-A"
    text: "40"

# Now confirm the discard: back to home with no live match.
- tapOn: "END MATCH"
- extendedWaitUntil:
    visible: "END THE MATCH?"
    timeout: 10000
- tapOn:
    id: "end-discard"
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 20000
- assertNotVisible: "LIVE NOW"
