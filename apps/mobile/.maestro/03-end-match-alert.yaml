# The native "End match?" alert — a real OS dialog, not a web confirm().
# This is the behaviour the Playwright suite fakes with page.on("dialog").
appId: com.holypadel.app
name: End match native alert
---
- runFlow: subflows/launch-seeded.yaml

- tapOn: "RESUME SCORING"
- extendedWaitUntil:
    visible:
      id: "point-A"
      text: "40"
    timeout: 20000

# Cancel first: the OS alert appears, "Keep scoring" dismisses it, score intact.
- tapOn: "END MATCH"
- extendedWaitUntil:
    visible: "The match is not finished — discard it?"
    timeout: 10000
- tapOn: "Keep scoring"
- assertVisible:
    id: "point-A"
    text: "40"

# Now confirm the discard: back to home with no live match.
- tapOn: "END MATCH"
- extendedWaitUntil:
    visible: "Discard match"
    timeout: 10000
- tapOn: "Discard match"
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 20000
- assertNotVisible: "LIVE NOW"
