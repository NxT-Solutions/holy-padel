# The full setup flow with the native player-picker sheet, played through to
# the match-won screen and saved to the ledger.
appId: com.holypadel.app
name: New match through to match won
---
- runFlow: subflows/launch-seeded.yaml

- tapOn: "NEW MATCH"
- extendedWaitUntil:
    visible: "Doubles · FIP scoring"
    timeout: 15000

# Best of 1 for a short flow.
- tapOn:
    text: "^1$"

# Team A partner via the picker sheet (Nico is fixed, pick the partner).
- tapOn:
    text: "Pick a player"
    index: 0
- extendedWaitUntil:
    visible: "PICK TEAM A"
    timeout: 10000
- tapOn: "Javi"
- tapOn: "DONE"

# Team B: with Javi taken, the two remaining "Pick a player" rows are team B.
- tapOn:
    text: "Pick a player"
    index: 0
- extendedWaitUntil:
    visible: "PICK TEAM B"
    timeout: 10000
- tapOn: "Marta"
- tapOn: "Leo"
- tapOn: "DONE"

- tapOn: "START MATCH"
- extendedWaitUntil:
    visible:
      id: "point-A"
      text: "0"
    timeout: 20000

# Win the set 6-0 to take the best-of-1 match.
- repeat:
    times: 24
    commands:
      - tapOn: "Point Nico & Javi"

- extendedWaitUntil:
    visible: "MATCH WON"
    timeout: 20000
- assertVisible: "DEF. MARTA & LEO"
- tapOn: "SAVE & CLOSE"

# The result reached the ledger: the matches tab count grew to 14.
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 20000
- tapOn:
    id: "tab-matches"
- extendedWaitUntil:
    visible: "14 stored locally"
    timeout: 15000
