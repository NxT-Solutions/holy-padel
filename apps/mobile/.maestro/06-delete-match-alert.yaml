# The native "Delete match?" alert from the overview, and the ledger shrinking.
appId: com.holypadel.app
name: Delete match native alert
---
- runFlow: subflows/launch-seeded.yaml

- tapOn: "MATCHES"
- extendedWaitUntil:
    visible: "13 stored locally"
    timeout: 15000
- tapOn: "6-3 · 7-6"
- extendedWaitUntil:
    visible: "DEF. MARTA & LEO"
    timeout: 15000

# Cancel keeps the match.
- tapOn: "DELETE MATCH"
- extendedWaitUntil:
    visible: "This removes the match and its points from this phone."
    timeout: 10000
- tapOn: "Cancel"
- assertVisible: "DEF. MARTA & LEO"

# Confirm deletes it and returns to the previous screen.
- tapOn: "DELETE MATCH"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 10000
- tapOn: "Delete"
- tapOn: "MATCHES"
- extendedWaitUntil:
    visible: "12 stored locally"
    timeout: 15000
