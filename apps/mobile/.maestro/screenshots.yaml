# Captures a screenshot of every screen on the emulator. Not an assertion flow —
# it drives the same navigation the test flows cover and saves device-real PNGs.
#
# Shots are written under ./screenshots (relative to where `maestro test` runs,
# i.e. the repo root) so the workflow can upload them — takeScreenshot does NOT
# write into the ~/.maestro/tests report dir.
#
# This is the coldest flow in the suite (fresh launch, no JIT warmup), so the
# content waits are generous (30s) and every shot settles animations first — the
# seeded Matches list derives a result badge per match and can render slowly on a
# cold emulator.
appId: com.holypadel.app
name: Capture screenshots
---
- runFlow: subflows/launch-seeded.yaml
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-01-home

- tapOn: "RESUME SCORING"
- extendedWaitUntil:
    visible:
      id: "point-A"
      text: "40"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-02-live-scoring

# Finish the match (one point wins the game, a love game wins set 2 and the match).
- repeat:
    times: 5
    commands:
      - tapOn: "Point Nico & Javi"
- extendedWaitUntil:
    visible: "MATCH WON"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-03-match-won
- tapOn: "SAVE & CLOSE"
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 30000

# Matches tab, then a finished match's overview (a pushed detail screen).
- tapOn:
    id: "tab-matches"
- waitForAnimationToEnd
# The count node reads "13 stored locally"; Maestro anchors the text regex to the
# whole node, so a bare "stored locally" never matches — use a wildcarded regex.
- extendedWaitUntil:
    visible: ".*stored locally.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-04-matches
- tapOn: "6-3 · 7-6"
- extendedWaitUntil:
    visible: "MATCH TOTALS"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-05-match-overview
# The overview is pushed on top of the tabs — go back before using the tab bar.
- back
- waitForAnimationToEnd

# Profile tab.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "WIN RATE"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-06-profile

# New match setup and the player picker sheet.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "HOLA, NICO"
    timeout: 30000
- tapOn: "NEW MATCH"
- extendedWaitUntil:
    visible: "Doubles · FIP scoring"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-07-new-match
- tapOn:
    text: "Pick a player"
    index: 0
- extendedWaitUntil:
    visible: "PICK TEAM A"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-08-player-picker
