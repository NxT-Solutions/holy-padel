apply plugin: 'com.android.library'

group = 'expo.modules.livenotification'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

android {
  namespace "expo.modules.livenotification"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // setRequestPromotedOngoing / setShortCriticalText (Android 16 Live Updates)
  // landed in core 1.17; 1.18.0 is the repo-wide pin (1.19 needs compileSdk 37).
  implementation "androidx.core:core:1.18.0"
}
